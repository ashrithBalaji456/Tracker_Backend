services:
  postgres:
    image: postgres:16
    container_name: team-task-manager-postgres
    environment:
      POSTGRES_DB: team_task_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
